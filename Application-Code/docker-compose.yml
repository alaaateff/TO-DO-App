version: '3.8'
services:    
    db:         
         image: mongo:8.3
         restart: unless-stopped
         volumes:           
          - mongodata:/data/db  
         
    web:         
         build: ./frontend   
         restart: unless-stopped 
         env_file: 
            - "./frontend/.env"   
         ports:
          - 3000:3000   
    
    app:    
         build: ./backend    
         restart: unless-stopped
         env_file:             
           - "./backend/.env"   
         ports:
          - 3500:3500    
         depends_on:             
           - db

volumes:  
    mongodata:  
